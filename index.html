<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Dashboard</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #101215; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { display: grid; gap: 14px; width: min(360px, calc(100vw - 40px)); }
    a { display: block; padding: 18px 20px; border: 1px solid #3a414b; border-radius: 12px; color: #f4f7fa; background: #1a1f26; text-decoration: none; text-align: center; font-weight: 650; }
    a:hover, a:focus-visible { background: #27313d; border-color: #7eb9ff; outline: none; }
  </style>
</head>
<body>
  <main aria-label="Dashboard navigation">
    <a href="hermes-wiki/">Hermes Wiki · Creative Reference</a>
    <a href="research_AI/">Research AI · 기존 페이지</a>
  </main>
</body>
</html>
