<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Creative Reference Archive</title><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f8fafc;color:#111827}header,main{max-width:1200px;margin:auto;padding:22px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden}.thumb{width:100%;aspect-ratio:16/9;object-fit:cover;background:#111827}.body{padding:14px}.tags{color:#475569;font-size:13px}.source{display:inline-block;margin-top:10px;background:#2563eb;color:#fff;text-decoration:none;padding:8px 10px;border-radius:7px}</style></head><body><header><h1>Creative Reference Archive</h1><p id="meta"></p></header><main><div id="grid" class="grid"></div></main><script>const FACET="general",DATA="data/latest.json",ASSET_PREFIX="",VIDEO_TAGS=new Set(["ai-video", "dreamina", "higgsfield", "hunyuan", "kling", "luma", "minimax-h3", "pika", "ref2video", "runway", "seedance", "seedance-2-0", "seedance-2-5", "seedance-2.5", "seedance2.5", "sora", "sora2", "veo", "video-generation", "video-to-video", "wan"]),PROMPT_TYPES=new Set(['image_prompt','video_prompt']),VIDEO_TYPES=new Set(['video_prompt','video_style']);function hasPrompt(c){return !!(c.facets&&c.facets.prompt)}function isVideo(c){return !!(c.facets&&c.facets.video_generation)}function matches(c){const p=hasPrompt(c),v=isVideo(c);return FACET==='prompts'?p:FACET==='video_generation'?v:!p&&!v}function el(t,cls,text){const n=document.createElement(t);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}fetch(DATA,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('data unavailable');return r.json()}).then(p=>{const cards=p.cards.filter(matches),grid=document.getElementById('grid');document.getElementById('meta').textContent=`${cards.length} cards · ${p.release_id}`;cards.forEach(c=>{const a=el('article','card'),img=el('img','thumb');img.src=ASSET_PREFIX+c.visual.src;img.alt=c.visual.alt;a.append(img);const b=el('div','body'),h=el('h2','',c.title),tags=el('div','tags',(c.tags||[]).map(t=>'#'+t).join(' ')),s=el('p','',c.summary);b.append(h,tags,s);if(FACET==='prompts'){const label=el('strong','',c.prompt.status==='captured'?'Prompt captured':'Prompt reference');b.append(label)}const link=el('a','source','원문 열기');link.href=c.source.url;link.target='_blank';link.rel='noopener';b.append(link);a.append(b);grid.append(a)});if(!cards.length)grid.textContent='표시할 카드가 없습니다.'}).catch(()=>{document.getElementById('meta').textContent='자료를 불러오지 못했습니다.'});</script></body></html>
