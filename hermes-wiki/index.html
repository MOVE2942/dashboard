<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Creative Reference Archive</title><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f8fafc;color:#111827}header{position:sticky;top:0;background:#f8fafc;border-bottom:1px solid #e5e7eb;padding:16px 22px;z-index:10}header,main{max-width:1240px;margin:auto}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.tab{border:1px solid #e5e7eb;border-radius:999px;padding:7px 13px;background:#fff;cursor:pointer;font-size:13px;color:#374151}.tab.active{background:#2563eb;border-color:#2563eb;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;padding:22px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;display:flex;flex-direction:column}.thumb{width:100%;aspect-ratio:16/9;object-fit:cover;background:#111827}.body{padding:14px;display:flex;flex-direction:column;gap:8px;flex:1}.title{font-weight:700;line-height:1.3;font-size:15px}.tags{color:#475569;font-size:12px;line-height:1.5}.summary{font-size:13px;color:#374151;line-height:1.45}.dates{font-size:11px;color:#6b7280;border-top:1px solid #f3f4f6;padding-top:8px;margin-top:auto}.source{display:inline-block;margin-top:2px;background:#2563eb;color:#fff;text-decoration:none;padding:8px 10px;border-radius:7px;font-size:13px;text-align:center}@media(max-width:720px){.grid{grid-template-columns:1fr}}</style></head><body><header><h1 style="margin:0 0 2px;font-size:22px">Creative Reference Archive</h1><p id="meta" style="margin:0;color:#6b7280;font-size:13px"></p><div class="tabs" id="tabs"></div></header><main><div id="grid" class="grid"></div></main><script>const DATA="data/latest.json",ASSET_PREFIX="",LABELS={"video_technique": "영상 제작 기법", "image_technique": "이미지 제작 기법", "agent_technique": "에이전트 활용 기법", "prompt_reference": "프롬프트 레퍼런스", "contest_info": "공모전/이벤트", "platform_info": "플랫폼/서비스", "visual_reference": "시각 레퍼런스", "ideas": "아이디어/기획", "ai_research": "AI 리서치/동향"};function fmt(v){if(!v)return null;const d=v.slice(0,10);return d.replace(/-/g,'.');}function el(t,cls,text){const n=document.createElement(t);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}let active='all';const allCards=[];fetch(DATA,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('data unavailable');return r.json()}).then(p=>{allCards.push(...p.cards);allCards.sort((a,b)=>(b.captured_at||'').localeCompare(a.captured_at||''));const keys=Object.keys(LABELS);const tabs=document.getElementById('tabs');const mk=(key,label)=>{const b=el('button','tab',label);b.onclick=()=>{active=key;render();document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active')};tabs.append(b)};mk('all','전체 ('+allCards.length+')');keys.forEach(k=>{const n=allCards.filter(c=>c.category===k).length;mk(k,LABELS[k]+' ('+n+')')});document.querySelector('.tab').classList.add('active');render();}).catch(e=>{document.getElementById('meta').textContent='자료를 불러오지 못했습니다.'});function render(){const grid=document.getElementById('grid');grid.textContent='';const cards=active==='all'?allCards:allCards.filter(c=>c.category===active);document.getElementById('meta').textContent=cards.length+' cards';cards.forEach(c=>{const a=el('article','card');const link=c.source&&c.source.url||'#';const wrap=el('a');wrap.href=link;wrap.target='_blank';wrap.rel='noopener noreferrer';wrap.style.display='block';const img=el('img','thumb');img.src=ASSET_PREFIX+(c.visual&&c.visual.src||'');img.alt=c.visual&&c.visual.alt||'';img.loading='lazy';wrap.append(img);a.append(wrap);const b=el('div','body');const title=el('a','title',c.title);title.href=link;title.target='_blank';title.rel='noopener noreferrer';title.style.textDecoration='none';title.style.color='#111827';b.append(title);const catLabel=el('div','tags','📂 '+((c.category&&LABELS[c.category])||'기타'));catLabel.style.color='#2563eb';catLabel.style.fontWeight='600';b.append(catLabel);if((c.tags||[]).length)b.append(el('div','tags',c.tags.map(t=>'#'+t).join(' ')));if(c.summary)b.append(el('div','summary',c.summary));const dates=el('div','dates');const cap=fmt(c.captured_at),pub=fmt(c.published_at);dates.textContent='수집: '+(cap||'미상')+' · 발행: '+(pub||'미상');b.append(dates);const src=el('a','source','🔗 원문 보기');src.href=link;src.target='_blank';src.rel='noopener noreferrer';b.append(src);a.append(b);grid.append(a)});if(!cards.length)grid.textContent='표시할 카드가 없습니다.';}</script></body></html>
